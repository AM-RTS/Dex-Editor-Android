plugins {
    id 'com.android.application'
}

android {
    namespace = "modder.hub.dexeditor"
    compileSdk 37

    defaultConfig {
        applicationId "modder.hub.dexeditor"
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk = 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 1
        versionName "2.0-sora-editor"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            // Both Google Smali and JADX's legacy Smali CLI bundle this CLI-only version resource.
            excludes += 'baksmali.properties'
        }
    }

    testOptions {
        managedDevices {
            localDevices {
                pixel2api35 {
                    device = 'Pixel 2'
                    apiLevel = 35
                    systemImageSource = 'google'
                    pageAlignment = com.android.build.api.dsl.ManagedVirtualDevice.PageAlignment.FORCE_16KB_PAGES
                    testedAbi = 'x86_64'
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.startup:startup-runtime:1.2.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.10'
    implementation 'com.android.tools.smali:smali-baksmali:3.0.10'
    implementation 'com.android.tools.smali:smali:3.0.10'
    //noinspection NewerVersionAvailable
    implementation 'com.google.guava:guava:33.0.0-android'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation platform('io.github.rosemoe:editor-bom:0.24.6')
    implementation 'io.github.rosemoe:editor'
    implementation 'io.github.rosemoe:language-textmate'
    implementation 'io.github.rosemoe:language-java'
    implementation 'io.github.skylot:jadx-core:1.5.6'
    implementation('io.github.skylot:jadx-dex-input:1.5.6') {
        exclude group: 'com.beust', module: 'jcommander'
    }
    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation "androidx.preference:preference:1.2.1"
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.github.angads25:filepicker:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
